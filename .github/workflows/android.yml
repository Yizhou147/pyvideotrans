name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.14.3'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.2.12479018'
  ANDROID_CMAKE: '3.22.1'
  APK_BUILD_ID: ${{ github.sha }}

jobs:
  build:
    name: Build subtitle APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties

      - name: Install Vulkan shader build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc spirv-headers libvulkan-dev

      - name: Cache pinned native sources
        uses: actions/cache@v6
        with:
          path: |
            android/third_party/whisper.cpp
            android/third_party/Vulkan-Headers
            android/third_party/SPIRV-Headers
            android/third_party/sherpa-onnx
            android/third_party/qnn
            android/third_party/onnxruntime
          key: native-src-${{ runner.os }}-${{ hashFiles('android/scripts/fetch-native-deps.sh') }}

      - name: Fetch native dependencies
        working-directory: android
        run: ./scripts/fetch-native-deps.sh

      - name: Build sherpa-onnx QNN JNI
        working-directory: android
        run: |
          NDK_VERSION="${ANDROID_NDK}"
          export ANDROID_NDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${NDK_VERSION}"
          ./scripts/build-sherpa-qnn.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest

      - name: Lint
        working-directory: android
        run: gradle lintDebug

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; the APK would not have a stable signature."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/subtitle.p12"

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleDebug \
            -PsigningFile="${RUNNER_TEMP}/subtitle.p12" \
            -PsigningStorePassword="${ANDROID_KEYSTORE_PASSWORD}" \
            -PsigningKeyAlias="${ANDROID_KEY_ALIAS}" \
            -PsigningKeyPassword="${ANDROID_KEY_PASSWORD}" \
            -PbuildId="${APK_BUILD_ID}"

      - name: Report the APK's foreground service types
        working-directory: android
        run: |
          set -uo pipefail
          aapt2=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | tail -1)
          apk=app/build/outputs/apk/debug/app-debug.apk
          if [ -z "$aapt2" ] || [ ! -f "$apk" ]; then
            echo "no aapt2 or no apk; skipping the manifest report"
            exit 0
          fi
          # What the device actually reads back, not what the source file says.
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
            | grep -E "foregroundServiceType|FOREGROUND_SERVICE|WAKE_LOCK|E: (service|uses-permission)" \
            | sed -e 's/^ *//'

      - name: Collect artifact
        working-directory: android
        run: |
          set -euo pipefail
          short=$(printf '%.7s' "${APK_BUILD_ID}")
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "../artifacts/subtitle-${short}.apk"
          ls -l ../artifacts
          (cd ../artifacts && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyvideotrans-subtitle-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
