name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.14.3'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.2.12479018'
  ANDROID_CMAKE: '3.22.1'

jobs:
  build:
    name: Build subtitle APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      # Keep one debug signing key across runs so consecutive APKs can update
      # in place instead of requiring an uninstall.
      - name: Cache debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-${{ runner.os }}-v1

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties

      - name: Install Vulkan shader build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc spirv-headers libvulkan-dev

      - name: Cache pinned native sources
        uses: actions/cache@v6
        with:
          path: |
            android/third_party/whisper.cpp
            android/third_party/Vulkan-Headers
            android/third_party/SPIRV-Headers
            android/third_party/sherpa-onnx
            android/third_party/qnn
            android/third_party/onnxruntime
          key: native-src-${{ runner.os }}-${{ hashFiles('android/scripts/fetch-native-deps.sh') }}

      - name: Fetch native dependencies
        working-directory: android
        run: ./scripts/fetch-native-deps.sh

      - name: Build sherpa-onnx QNN JNI
        working-directory: android
        run: |
          NDK_VERSION="${ANDROID_NDK}"
          export ANDROID_NDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${NDK_VERSION}"
          ./scripts/build-sherpa-qnn.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest

      - name: Lint
        working-directory: android
        run: gradle lintDebug

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Decode release keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
            echo "Release APK will be signed."
          else
            echo "ANDROID_KEYSTORE_BASE64 is not set; release APK will be unsigned."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Collect artifacts
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -exec cp {} ../artifacts/ \;
          if [ -d app/build/outputs/mapping/release ]; then
            cp app/build/outputs/mapping/release/mapping.txt ../artifacts/ 2>/dev/null || true
          fi
          (cd ../artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pyvideotrans-subtitle-phase0
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
