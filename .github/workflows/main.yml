name: Compile Python
# This inherited workflow has never passed on the fork, and it runs on windows-latest;
# letting every android-only push start it is what got Actions disabled for wasted compute.
on:
  push:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/**'
jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - name: Versatile PyInstaller
        uses: sayyid5416/pyinstaller@v1.6.0    
        with: 
         python_ver: '3.10'
         pyinstaller_ver: '==6.3.0'
         spec: 'sp.spec'
         requirements: 'requirements-win-gpu.txt'
         upload_exe_with_name: 'sp1.5'
         options: --name "sp"--windowed
